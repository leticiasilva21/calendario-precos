<style>
/* Identidade Carpediem, tema claro fixo */
:root{--navy:#16294F;--orange:#F26B2E;--orange-soft:#fde9df;--bg:#fff;--panel:#F5F6F9;--line:#E3E6EC;--ink:#16294F;--mute:#5f6676;
--bad:#B3261E;--bad-soft:#fbe7e5;--ok:#1d7a46;--ok-soft:#e3f4ea;--warn-soft:#fdf3d9;--occ:#eceff4;
--font:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
.bar-top{background:var(--navy);color:#fff;padding:10px 16px}
.bar-top .in{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar-top img{height:30px;display:block}
.bar-top .t{font-weight:700;font-size:1.05rem;border-left:1px solid rgba(255,255,255,.3);padding-left:16px}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{background:transparent;border:0;color:#fff;opacity:.75;padding:6px 12px;border-radius:6px}
.tabs button.on{opacity:1;background:rgba(255,255,255,.15)}
.tabs button:hover{background:rgba(255,255,255,.1)}
.user{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:.85rem}
.user button{border-color:rgba(255,255,255,.5);color:#fff;background:transparent;padding:3px 10px}
button{font:inherit;font-weight:700;border:1px solid var(--orange);background:var(--bg);color:var(--orange);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--orange-soft)}
button.prim{background:var(--orange);color:#fff}button.prim:hover{background:#e05d22}
button[disabled]{opacity:.55;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
select,input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.faixa{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.faixa label{display:flex;gap:6px;align-items:center;font-weight:600;color:var(--mute)}
.dows{display:flex;gap:3px}
.dows button{padding:3px 8px;font-size:.8rem;border:1px dashed #b8bfcc;background:#fff;color:#9aa1ae;text-decoration:line-through}
.dows button.on{background:var(--navy);border:1px solid var(--navy);color:#fff;text-decoration:none}
.dows button:not(.on):hover{background:var(--panel)}
.selo{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px}
.selo::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.selo.verde{background:var(--ok-soft);color:var(--ok)}.selo.amarelo{background:var(--warn-soft);color:#8a6100}.selo.vermelho{background:var(--bad-soft);color:var(--bad)}
.legenda{margin:10px 16px 0;font-size:.8rem;color:var(--mute)}
.legenda summary{cursor:pointer;font-weight:700;color:var(--navy);width:max-content}
.legenda .itens{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:8px 0 2px}
.legenda .it{display:flex;align-items:center;gap:6px}
.legenda .sw{display:inline-block;width:22px;height:14px;border-radius:3px;border:1px solid var(--line)}
.legenda .escala{display:inline-block;width:120px;height:14px;border-radius:3px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(29,122,70,.55),#fff 33%,rgba(242,107,46,.55))}
.mute{color:var(--mute)}.small{font-size:.82rem}
.wrap{padding:16px}
/* grade */
.gridbox{overflow:auto;max-height:calc(100vh - 250px);border:1px solid var(--line);border-radius:8px;margin:12px 16px}
table.g{border-collapse:separate;border-spacing:0;font-size:.8rem}
.g th,.g td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
.g thead th{position:sticky;top:0;background:#fff;z-index:3}
.g tr.occ th,.g tr.occ td{position:sticky;top:38px;z-index:3;background:#fff}
.g tr.sug th,.g tr.sug td{position:sticky;top:62px;z-index:3;background:#fff}
.g .nm{position:sticky;left:0;background:#fff;z-index:2;min-width:210px;max-width:210px;text-align:left;padding:4px 8px;overflow:hidden;text-overflow:ellipsis}
.g thead .nm,.g tr.occ .nm,.g tr.sug .nm{z-index:4}
.g .dh{min-width:54px;padding:3px 2px;text-align:center;cursor:pointer;font-weight:600;line-height:1.15}
.g .dh small{display:block;color:var(--mute);font-weight:600;font-size:.7rem}
.g .dh.we{background:#f3f4f8}
.g .dh.sel{background:var(--orange);color:#fff}.g .dh.sel small{color:#fff}
.g td.c{text-align:center;padding:3px 2px;height:34px;position:relative;cursor:pointer;font-variant-numeric:tabular-nums}
.g td.c.full{background:var(--occ)!important;color:#8a91a0}
.g td.c.blk{background:repeating-linear-gradient(135deg,#eef0f4 0 5px,#d9dde5 5px 7px)!important;color:#8a91a0}
.g td.c .sg{display:block;font-size:.68rem;line-height:1.1;white-space:nowrap}
.g td.c .sg s{color:var(--mute);font-weight:600}.g td.c .sg b{color:var(--navy)}
.g td.c.sel{box-shadow:inset 0 0 0 2px var(--orange)}
.g.temsel td.c:not(.sel){opacity:.42}
.g td.c{user-select:none}
.up-t{color:#b4501f}.dn-t{color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(22,41,79,.35);z-index:30;display:grid;place-items:center;padding:16px}
.modal .caixa{background:#fff;border-radius:12px;max-width:860px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 12px 40px rgba(22,41,79,.25)}
.modal .pe{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:14px;position:sticky;bottom:-20px;background:#fff;padding:10px 0}
.modal .pe span{margin-right:auto}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.kpis>div{background:var(--panel);border-radius:8px;padding:8px 12px;display:grid;min-width:110px}
.kpis b{font-size:1.15rem;font-variant-numeric:tabular-nums}.kpis span{font-size:.78rem;color:var(--mute);font-weight:600}.kpis small{font-size:.74rem;color:var(--mute)}
.rtab{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.aviso{background:var(--warn-soft);color:#6b4b00;border-radius:8px;padding:8px 12px;font-size:.85rem;margin:6px 0}
.g td.c .p{font-weight:700;display:block}
.sg s{color:var(--mute);font-weight:600}
.g td.c .b{font-size:.66rem;display:inline-block;border-radius:4px;padding:0 3px;margin:0 1px;font-weight:700}
.b.up{background:var(--ok-soft);color:var(--ok)}.b.dn{background:var(--bad-soft);color:var(--bad)}.b.n1{background:var(--warn-soft);color:#8a6100}
.b.av{color:var(--mute);font-weight:600}
.g td.o{text-align:center;font-weight:800;padding:3px 0}
.g tr.row.off .nm{opacity:.55}
.nm input{vertical-align:-2px;margin-right:6px}
.nm .tag{font-size:.68rem;color:var(--mute);margin-left:4px;font-weight:600}
/* painel de ação */
.acao{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--orange);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;z-index:6;box-shadow:0 -4px 14px rgba(22,41,79,.08)}
.acao .sel{font-weight:800}
.prev{margin:0 16px 12px;padding:10px 12px;background:var(--panel);border-radius:8px;font-size:.85rem}
.prev table{border-collapse:collapse;margin-top:6px}.prev td,.prev th{padding:2px 10px 2px 0;text-align:left}
.msg{color:var(--bad);font-weight:600}.okmsg{color:var(--ok);font-weight:600}
/* tabelas gerais */
table.t{border-collapse:collapse;width:100%;font-size:.85rem}
.t th,.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.t th{background:var(--panel);position:sticky;top:0}
.t input{width:80px}
.card{max-width:980px}
h2{font-weight:800;font-size:1.15rem;margin:4px 0 8px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--panel);padding:16px}
.login form{background:#fff;border-radius:12px;padding:28px;width:min(380px,100%);display:grid;gap:12px;box-shadow:0 6px 24px rgba(22,41,79,.08)}
.login img{height:40px;justify-self:start}
.login label{display:grid;gap:4px;font-weight:600}
.login .link{border:0;background:none;color:var(--navy);text-decoration:underline;font-weight:600;padding:0;justify-self:start}
.tip{position:fixed;z-index:20;background:var(--navy);color:#fff;border-radius:8px;padding:8px 10px;font-size:.78rem;pointer-events:none;max-width:320px;line-height:1.4}
</style>
</head>
<body>
<div id="app"><p class="wrap">Carregando…</p></div>
<div class="tip" id="tip" hidden></div>
<script>
const SUPA = "https://ucavfotyciwnqwurzjny.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjYXZmb3R5Y2l3bnF3dXJ6am55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc5NzUzNjYsImV4cCI6MjA3MzU1MTM2Nn0.nE_W8wZZvJfzlvhP83ge1J0ooS3EcFVSlQYK28eTGU0";
const FN = SUPA + "/functions/v1/calendario-precos";
const DOMINIO = /^[^@\s]+@carpediemhomes\.com\.br$/i;
let criandoSenha = /type=(recovery|invite|signup)/.test(location.hash);
const sb = supabase.createClient(SUPA, ANON, { auth: { persistSession: true, detectSessionInUrl: true, storageKey: "calendario-precos-auth" } });
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (v) => Math.round(v).toLocaleString("pt-BR");
const brl = (v) => v == null ? "—" : "R$ " + Math.round(v).toLocaleString("pt-BR");
const DOW = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const hoje = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
const addD = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dowOf = (d) => new Date(d + "T12:00:00Z").getUTCDay();
const fmtD = (d) => d.slice(8, 10) + "/" + d.slice(5, 7);
const fmtHora = (iso) => new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });

async function api(action, body = {}) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { telaLogin(); throw new Error("Sessão expirada."); }
  const r = await fetch(FN, { method: "POST", headers: { apikey: ANON, Authorization: "Bearer " + session.access_token, "Content-Type": "application/json" }, body: JSON.stringify({ action, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Erro " + r.status);
  return j;
}

/* ---------- preço (mesma conta do servidor) ---------- */
function calcular(base, pct, one) {
  const f = 1 + (pct || 0) / 100;
  const tem1 = base.some((t) => t[0] === 1);
  let out = base.filter((t) => t[0] !== 1 || tem1).map((t) => [t[0], Math.round(t[1] * f)]);
  if (one !== null && one !== undefined) {
    const ref = out.filter((t) => t[0] > 1).sort((a, b) => a[0] - b[0])[0] || out[0];
    if (ref) { const v = Math.round(ref[1] * (1 + one / 100)); out = out.filter((t) => t[0] !== 1); out.unshift([1, v]); }
  }
  out.sort((a, b) => a[0] - b[0]);
  for (let i = 1; i < out.length; i++) if (out[i][1] > out[i - 1][1]) out[i][1] = out[i - 1][1];
  return out;
}
/* cor pelo desvio do preço atual sobre a base: verde abaixo, neutro na base, laranja acima (limites -25% e +50%) */
function corDesvio(pct) {
  if (pct == null || !isFinite(pct) || Math.abs(pct) < 0.5) return "";
  const t = pct < 0 ? Math.min(1, -pct / 25) : Math.min(1, pct / 50);
  const a = (0.1 + 0.45 * t).toFixed(2);
  return pct < 0 ? `rgba(29,122,70,${a})` : `rgba(242,107,46,${a})`;
}
const desvioPct = (atual, base) => { const a = minTier(atual), b = minTier(base); return a && b && b[1] ? 100 * (a[1] / b[1] - 1) : null; };
const minTier = (p) => (p && p.length ? p.filter((t) => t[0] > 1)[0] || p[0] : null);
const tierTxt = (p) => (p || []).map((t) => `${t[0]}+ noites: ${brl(t[1])}`).join("<br>") || "sem preço";

/* ---------- login ---------- */
function telaLogin(aviso) {
  $("#app").innerHTML = `<div class="login"><form id="f-login"><img src="logo.png" alt="Carpediem Homes">
    <h2>Calendário de Preços</h2><span class="mute">Entre com seu e-mail e senha Carpediem.</span>
    <label>E-mail<input id="l-email" type="email" autocomplete="username" required></label>
    <label>Senha<input id="l-senha" type="password" autocomplete="current-password" required></label>
    <button class="prim" id="l-btn">Entrar</button><span class="msg" id="l-msg">${esc(aviso || "")}</span>
    <button type="button" class="link" id="l-pa">Primeiro acesso ou esqueci minha senha</button></form></div>`;
  $("#l-pa").onclick = () => telaPrimeiro($("#l-email").value);
  $("#f-login").onsubmit = async (e) => {
    e.preventDefault();
    const email = $("#l-email").value.trim().toLowerCase();
    if (!DOMINIO.test(email)) return ($("#l-msg").textContent = "Use seu e-mail @carpediemhomes.com.br.");
    $("#l-btn").disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email, password: $("#l-senha").value });
    $("#l-btn").disabled = false;
    if (error) $("#l-msg").textContent = /invalid/i.test(error.message) ? "E-mail ou senha incorretos. Primeiro acesso? Use o link abaixo." : "Não consegui entrar agora.";
  };
}
function telaPrimeiro(email0) {
  $("#app").innerHTML = `<div class="login"><form id="f-pa"><img src="logo.png" alt="Carpediem Homes">
    <h2>Primeiro acesso</h2><span class="mute">Vamos mandar um link para você criar ou trocar sua senha.</span>
    <label>E-mail<input id="pa-email" type="email" value="${esc(email0 || "")}" required></label>
    <button class="prim" id="pa-btn">Enviar link</button><span id="pa-msg"></span>
    <button type="button" class="link" id="pa-v">Voltar para o login</button></form></div>`;
  $("#pa-v").onclick = () => telaLogin();
  $("#f-pa").onsubmit = async (e) => {
    e.preventDefault();
    const email = $("#pa-email").value.trim().toLowerCase(), m = $("#pa-msg");
    if (!DOMINIO.test(email)) { m.className = "msg"; return (m.textContent = "Use seu e-mail @carpediemhomes.com.br."); }
    $("#pa-btn").disabled = true;
    try {
      const voltar = location.hostname === "localhost" ? location.origin + location.pathname : undefined;
      const r = await fetch(FN, { method: "POST", headers: { apikey: ANON, "Content-Type": "application/json" }, body: JSON.stringify({ action: "acesso", email, voltar }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      m.className = "okmsg"; m.textContent = `Enviamos um link para ${email}. Confira também o spam.`;
    } catch (err) { m.className = "msg"; m.textContent = err.message || "Não consegui enviar."; }
    $("#pa-btn").disabled = false;
  };
}
function telaSenha(email) {
  $("#app").innerHTML = `<div class="login"><form id="f-cs"><img src="logo.png" alt="Carpediem Homes"><h2>Crie sua senha</h2><span class="mute">${esc(email || "")}</span>
    <label>Nova senha<input id="cs1" type="password" minlength="8" autocomplete="new-password" required></label>
    <label>Repita<input id="cs2" type="password" minlength="8" autocomplete="new-password" required></label>
    <button class="prim" id="cs-btn">Salvar e entrar</button><span class="msg" id="cs-msg"></span></form></div>`;
  $("#f-cs").onsubmit = async (e) => {
    e.preventDefault();
    const a = $("#cs1").value;
    if (a.length < 8) return ($("#cs-msg").textContent = "Mínimo de 8 caracteres.");
    if (a !== $("#cs2").value) return ($("#cs-msg").textContent = "As senhas estão diferentes.");
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) return ($("#cs-msg").textContent = "Não consegui salvar. Peça um novo link.");
    criandoSenha = false; history.replaceState(null, "", location.pathname); iniciar();
  };
}

/* ---------- estado ---------- */
const S = {
  user: null, tab: "cal", regions: [], limites: { PCT_MIN: -25, PCT_MAX: 200, ONE_NIGHT_MAX: 200 },
  region: localStorage.getItem("cp-region") || "", from: hoje(), to: addD(hoje(), 41),
  dows: new Set([0, 1, 2, 3, 4, 5, 6]), busca: "",
  grid: null, sug: null, selL: new Set(), selD: new Set(), op: "pct", val: "",
};
try { const f = JSON.parse(localStorage.getItem("cp-dows") || "null"); if (Array.isArray(f)) S.dows = new Set(f); } catch {}

function cabecalho() {
  return `<header class="bar-top"><div class="in"><img src="logo-branco.png" alt="Carpediem Homes"><span class="t">Calendário de Preços</span>
   <nav class="tabs">${[["cal", "Calendário"], ["auto", "Automação"], ["log", "Histórico"]].map(([k, n]) => `<button data-tab="${k}" class="${S.tab === k ? "on" : ""}">${n}</button>`).join("")}</nav>
   <span class="user"><span>${esc(S.user)}</span><button id="sair">Sair</button></span></div></header>`;
}
function ligarCab() {
  $("#sair").onclick = async () => { await sb.auth.signOut(); telaLogin(); };
  document.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { S.tab = b.dataset.tab; render(); }));
}
function render() {
  if (S.tab === "cal") return telaCal();
  if (S.tab === "auto") return telaAuto();
  return telaLog();
}

/* ---------- calendário ---------- */
function datas() { const out = []; for (let d = S.from; d <= S.to; d = addD(d, 1)) out.push(d); return out; }
function faixaFiltros() {
  return `<div class="faixa">
   <label>Região <select id="f-reg"><option value="">Escolha…</option>${S.regions.map((r) => `<option ${r.name === S.region ? "selected" : ""} value="${esc(r.name)}">${esc(r.name)} (${r.n})</option>`).join("")}</select></label>
   <label>De <input type="date" id="f-from" value="${S.from}" min="${hoje()}"></label>
   <label>Até <input type="date" id="f-to" value="${S.to}" min="${hoje()}"></label>
   <span class="dows" title="Dias da semana usados na seleção">${[1, 2, 3, 4, 5, 6, 0].map((d) => `<button data-dow="${d}" aria-pressed="${S.dows.has(d)}" class="${S.dows.has(d) ? "on" : ""}" title="${S.dows.has(d) ? "Ligado: entra na seleção" : "Desligado: fora da seleção"}">${DOW[d]}</button>`).join("")}</span>
   <button class="prim" id="f-load">Carregar</button>
   <button id="f-refresh" title="Relê preços e disponibilidade da Stays para a região agora">Atualizar da Stays</button>
   <input id="f-busca" placeholder="Filtrar imóvel…" value="${esc(S.busca)}" style="flex:0 1 200px">
   <span class="mute small" id="f-info"></span></div>`;
}
function telaCal() {
  $("#app").innerHTML = cabecalho() + faixaFiltros() + `<div id="gridarea">${S.grid ? "" : `<p class="wrap mute">Escolha a região tarifária e o período e clique em <b>Carregar</b>.</p>`}</div>`;
  ligarCab();
  $("#f-reg").onchange = (e) => { S.region = e.target.value; localStorage.setItem("cp-region", S.region); };
  $("#f-from").onchange = (e) => (S.from = e.target.value);
  $("#f-to").onchange = (e) => (S.to = e.target.value);
  document.querySelectorAll("[data-dow]").forEach((b) => (b.onclick = () => {
    const d = +b.dataset.dow; S.dows.has(d) ? S.dows.delete(d) : S.dows.add(d);
    localStorage.setItem("cp-dows", JSON.stringify([...S.dows])); const on = b.classList.toggle("on"); b.setAttribute("aria-pressed", on); b.title = on ? "Ligado: entra na seleção" : "Desligado: fora da seleção";
    if (S.grid) { selecionarDatasPelosDias(); desenharGrade(); }
  }));
  $("#f-busca").oninput = (e) => { S.busca = e.target.value; if (S.grid) desenharGrade(); };
  $("#f-load").onclick = carregarGrade;
  $("#f-refresh").onclick = async (e) => {

   ${R.top.map((x) => `<tr><td>${esc(nomeCurto(x.nome))}</td><td>${fmtD(x.d)}</td><td>${fmtFaixas(x.antes)}</td><td><b>${fmtFaixas(x.depois)}</b></td><td class="${x.dr > 0 ? "up-t" : x.dr < 0 ? "dn-t" : ""}">${x.dr ? `${sinal(x.dp, 1)}%<br><span class="small">${sinal(x.dr)} R$</span>` : "1 noite"}</td></tr>`).join("")}</table></div>
   ${R.n > R.top.length ? `<p class="small mute">… e mais ${R.n - R.top.length} diárias.</p>` : ""}`;
}
function abrirModal(html, botao, onOk) {
  fecharModal();
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div class="caixa" role="dialog" aria-modal="true">${html}<div class="pe"><span id="m-msg" class="small"></span><button id="m-x">Cancelar</button>${botao ? `<button class="prim" id="m-ok">${botao}</button>` : ""}</div></div>`;
  document.body.appendChild(m);
  m.onclick = (e) => { if (e.target === m) fecharModal(); };
  $("#m-x").onclick = fecharModal;
  if (botao) $("#m-ok").onclick = onOk;
  document.addEventListener("keydown", escModal);
}
function escModal(e) { if (e.key === "Escape") fecharModal(); }
function fecharModal() { $("#modal")?.remove(); document.removeEventListener("keydown", escModal); }
function abrirResumo(P) {
  abrirModal(htmlResumo(P.R, P.titulo), P.R.n ? `Confirmar e gravar ${P.R.n} diárias na Stays` : null, () => { fecharModal(); executar(P.exec); });
}
function nomes() { return Object.fromEntries(S.grid.listings.map((l) => [l.id, l.nome])); }
function previa() {
  const e = validar(); if (e) return ($("#a-msg").innerHTML = `<span class="msg">${e}</span>`);
  const R = resumir(simular(), nomes());
  const op = S.op, pct = Number(S.val), sell_ids = [...S.selL], dates = [...S.selD].sort();
  const tit = { pct: `Prévia: ajuste de ${sinal(pct)}% sobre a base`, one_night_on: `Prévia: liberar 1 noite com +${pct}%`, one_night_off: "Prévia: tirar a liberação de 1 noite", reset: "Prévia: voltar para a diária base", rebase: "Prévia: redefinir a base" }[op];
  S.prev = { chave: chave(), R, titulo: tit, exec: () => api("apply", { op, pct, one_night_pct: pct, sell_ids, dates }) };
  atualizarBotaoGravar(); $("#a-msg").innerHTML = "";
  abrirResumo(S.prev);
}
function previaSugestao() {
  const mapa = {}; for (const d of S.selD) if (S.sug?.[d]?.pct != null) mapa[d] = S.sug[d].pct;
  const dates = Object.keys(mapa).sort();
  if (!S.selL.size || !dates.length) return ($("#a-msg").innerHTML = `<span class="msg">Nenhuma data selecionada tem regra de automação aplicável.</span>`);
  const R = resumir(simular("pct", 0, mapa), nomes());
  const sell_ids = [...S.selL], region = S.region, from = S.from, to = S.to;
  abrirResumo({ R, titulo: `Prévia: sugestão da automação em ${dates.length} data${dates.length === 1 ? "" : "s"}`, exec: () => api("apply_suggest", { region, from, to, dates, sell_ids }) });
}
async function executar(fn) {
  const btns = document.querySelectorAll(".acao button"); btns.forEach((b) => (b.disabled = true));
  $("#a-msg").innerHTML = `<span class="mute">Gravando na Stays… pode levar alguns minutos.</span>`;
  try {
    const r = await fn(); S.prev = null;
    const txt = `Pronto: ${r.ok} gravadas, ${r.sem_mudanca} já estavam certas${r.sem_base ? `, ${r.sem_base} sem preço na Stays` : ""}.`;
    await carregarGrade();
    $("#a-msg").innerHTML = r.erro ? `<span class="msg">${r.erro} com erro — reprecificar: ${esc(r.erros.join(" | "))}</span>` : `<span class="okmsg">${txt}</span>`;
    if (r.erro) alert(`Atenção: ${r.erro} diárias NÃO foram gravadas corretamente.\n\n${r.erros.join("\n")}`);
  } catch (err) { $("#a-msg").innerHTML = `<span class="msg">${esc(err.message)}</span>`; btns.forEach((b) => (b.disabled = false)); }
}

/* ---------- automação ---------- */
let REGRAS = [];
async function telaAuto() {
  $("#app").innerHTML = cabecalho() + `<div class="wrap card"><h2>Tabela de automação: ocupação × antecedência</h2>
   <p class="mute">Para cada dia, o sistema calcula a ocupação da região tarifária e quantos dias faltam para o check-in. A primeira linha que encaixar define o ajuste sobre a diária base (de ${S.limites.PCT_MIN}% a +${S.limites.PCT_MAX}%). A sugestão aparece na grade do calendário; nada é gravado sem você clicar em <b>Aplicar sugestão</b>.</p>
   <div id="rg">Carregando…</div></div>`;
  ligarCab();
  try { REGRAS = (await api("rules_get")).rules; desenharRegras(); } catch (e) { $("#rg").innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
}
function desenharRegras(msg) {
  $("#rg").innerHTML = `<table class="t"><tr><th>#</th><th>Ocupação de (%)</th><th>até (%)</th><th>Antecedência de (dias)</th><th>até (dias)</th><th>Ajuste (%)</th><th>Ativa</th><th></th></tr>
   ${REGRAS.map((r, i) => `<tr><td>${i + 1}</td>${["occ_min", "occ_max", "lead_min", "lead_max", "pct"].map((k) => `<td><input type="number" data-i="${i}" data-k="${k}" value="${r[k] ?? ""}"></td>`).join("")}
   <td><input type="checkbox" data-i="${i}" data-k="ativo" ${r.ativo !== false ? "checked" : ""} style="width:auto"></td>
   <td><button data-up="${i}" title="Subir">↑</button> <button data-del="${i}" title="Apagar linha">Apagar</button></td></tr>`).join("")}</table>
   <p><button id="r-add">+ Adicionar linha</button> <button class="prim" id="r-save">Salvar regras</button> <span id="r-msg">${msg || ""}</span></p>
   <p class="mute small">Dica: as faixas são inclusivas (ex.: 0–40% e 40–60% — o dia com exatamente 40% cai na primeira linha).</p>`;
  document.querySelectorAll("#rg input[data-k]").forEach((inp) => (inp.onchange = () => { const r = REGRAS[+inp.dataset.i]; r[inp.dataset.k] = inp.type === "checkbox" ? inp.checked : inp.value; }));
  document.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { REGRAS.splice(+b.dataset.del, 1); desenharRegras(); }));
  document.querySelectorAll("[data-up]").forEach((b) => (b.onclick = () => { const i = +b.dataset.up; if (i > 0) { [REGRAS[i - 1], REGRAS[i]] = [REGRAS[i], REGRAS[i - 1]]; desenharRegras(); } }));
  $("#r-add").onclick = () => { REGRAS.push({ occ_min: 0, occ_max: 100, lead_min: 0, lead_max: 7, pct: 0, ativo: true }); desenharRegras(); };
  $("#r-save").onclick = async () => {
    try { await api("rules_save", { rules: REGRAS }); REGRAS = (await api("rules_get")).rules; S.grid = null; desenharRegras(`<span class="okmsg">Regras salvas.</span>`); }
    catch (e) { $("#r-msg").innerHTML = `<span class="msg">${esc(e.message)}</span>`; }
  };
}

/* ---------- histórico ---------- */
async function telaLog() {
  $("#app").innerHTML = cabecalho() + `<div class="faixa"><label>Região <select id="lg-reg"><option value="">Todas</option>${S.regions.map((r) => `<option>${esc(r.name)}</option>`).join("")}</select></label>
   <label>Usuário <input id="lg-user" placeholder="e-mail"></label><button id="lg-go">Filtrar</button></div><div class="wrap" id="lg">Carregando…</div>`;
  ligarCab();
  $("#lg-go").onclick = carregarLog; carregarLog();
}
const NOMES_OP = { pct: "Ajuste %", one_night_on: "Liberou 1 noite", one_night_off: "Tirou 1 noite", reset: "Voltou à base", rebase: "Redefiniu base", desfazer: "Desfez", regras: "Alterou regras" };
async function carregarLog() {
  try {
    const { rows } = await api("log", { region: $("#lg-reg").value || undefined, user: $("#lg-user").value.trim() || undefined, limit: 1000 });
    const lotes = {};
    for (const r of rows) { const k = r.batch_id || "r" + r.id; (lotes[k] ??= { ...r, n: 0, erros: 0, imoveis: new Set(), datas: [] }); lotes[k].n++; if (r.status !== "ok") lotes[k].erros++; if (r.sell_nome) lotes[k].imoveis.add(r.sell_nome); if (r.date) lotes[k].datas.push(r.date); }
    const fmt = (p) => (p || []).map((t) => `${t[0]}n ${brl(t[1])}`).join(" · ");
    $("#lg").innerHTML = `<table class="t"><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Região</th><th>Imóveis</th><th>Datas</th><th>Diárias</th><th></th></tr>
     ${Object.values(lotes).map((b) => { const ds = b.datas.sort(); return `<tr><td>${fmtHora(b.at)}</td><td>${esc(b.user_email)}</td><td>${NOMES_OP[b.action] || esc(b.action)}${b.pct != null && b.action === "pct" ? ` ${b.pct > 0 ? "+" : ""}${b.pct}%` : ""}${b.action === "one_night_on" ? ` +${b.one_night_pct}%` : ""}<div class="small mute">${esc(b.origem || "")}</div></td>
       <td>${esc(b.region_name || "")}</td><td>${b.imoveis.size}<div class="small mute">${esc([...b.imoveis].slice(0, 2).join(", "))}${b.imoveis.size > 2 ? "…" : ""}</div></td>
       <td>${ds.length ? fmtD(ds[0]) + (ds.length > 1 ? " a " + fmtD(ds[ds.length - 1]) : "") : ""}</td>
       <td>${b.n}${b.erros ? ` <span class="msg">(${b.erros} com erro)</span>` : ""}<div class="small mute">${b.date ? "ex.: " + fmt(b.before) + " → " + fmt(b.after) : ""}</div></td>
       <td>${b.batch_id && b.action !== "regras" && b.action !== "desfazer" && b.n - b.erros > 0 ? `<button data-rev="${b.batch_id}">Desfazer</button>` : ""}</td></tr>`; }).join("") || `<tr><td colspan="8" class="mute">Nenhuma alteração ainda.</td></tr>`}</table>`;
    document.querySelectorAll("[data-rev]").forEach((b) => (b.onclick = async () => {
      if (!confirm("Voltar as diárias desse lote para o valor anterior na Stays?")) return;
      b.disabled = true; b.textContent = "Desfazendo…";
      try { const r = await api("revert", { batch_id: b.dataset.rev }); alert(r.erros.length ? `Desfeito com erros:\n${r.erros.join("\n")}` : `Desfeito: ${r.ok} diárias.`); S.grid = null; carregarLog(); }
      catch (e) { alert(e.message); b.disabled = false; b.textContent = "Desfazer"; }
    }));
  } catch (e) { $("#lg").innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
}

/* ---------- início ---------- */
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return telaLogin();
  if (!DOMINIO.test(session.user.email || "")) { await sb.auth.signOut(); return telaLogin("Só contas @carpediemhomes.com.br."); }
  S.user = session.user.email;
  try { const r = await api("regions"); S.regions = r.regions; S.limites = r.limites || S.limites; }
  catch (e) { $("#app").innerHTML = `<p class="wrap msg">${esc(e.message)}</p>`; return; }
  if (S.region && !S.regions.some((r) => r.name === S.region)) S.region = "";
  render();
}
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "PASSWORD_RECOVERY") { criandoSenha = true; telaSenha(session?.user?.email); }
  else if (ev === "SIGNED_IN" && !criandoSenha && !S.user) iniciar();
});
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (criandoSenha && session) return telaSenha(session.user.email);
  if (!criandoSenha) iniciar();
})();
</script>
