<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calendário de Preços · Carpediem</title>
<link rel="icon" href="icone.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Identidade Carpediem, tema claro fixo */
:root{--navy:#16294F;--orange:#F26B2E;--orange-soft:#fde9df;--bg:#fff;--panel:#F5F6F9;--line:#E3E6EC;--ink:#16294F;--mute:#5f6676;
--bad:#B3261E;--bad-soft:#fbe7e5;--ok:#1d7a46;--ok-soft:#e3f4ea;--warn-soft:#fdf3d9;--occ:#eceff4;
--font:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
.bar-top{background:var(--navy);color:#fff;padding:10px 16px}
.bar-top .in{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar-top img{height:30px;display:block}
.bar-top .t{font-weight:700;font-size:1.05rem;border-left:1px solid rgba(255,255,255,.3);padding-left:16px}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{background:transparent;border:0;color:#fff;opacity:.75;padding:6px 12px;border-radius:6px}
.tabs button.on{opacity:1;background:rgba(255,255,255,.15)}
.tabs button:hover{background:rgba(255,255,255,.1)}
.user{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:.85rem}
.user button{border-color:rgba(255,255,255,.5);color:#fff;background:transparent;padding:3px 10px}
button{font:inherit;font-weight:700;border:1px solid var(--orange);background:var(--bg);color:var(--orange);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--orange-soft)}
button.prim{background:var(--orange);color:#fff}button.prim:hover{background:#e05d22}
button[disabled]{opacity:.55;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
select,input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.faixa{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.faixa label{display:flex;gap:6px;align-items:center;font-weight:600;color:var(--mute)}
.dows{display:flex;gap:3px}
.dows button{padding:3px 8px;font-size:.8rem;border:1px dashed #b8bfcc;background:#fff;color:#9aa1ae;text-decoration:line-through}
.dows button.on{background:var(--navy);border:1px solid var(--navy);color:#fff;text-decoration:none}
.dows button:not(.on):hover{background:var(--panel)}
.selo{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px}
.selo::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.selo.verde{background:var(--ok-soft);color:var(--ok)}.selo.amarelo{background:var(--warn-soft);color:#8a6100}.selo.vermelho{background:var(--bad-soft);color:var(--bad)}
.legenda{margin:10px 16px 0;font-size:.8rem;color:var(--mute)}
.legenda summary{cursor:pointer;font-weight:700;color:var(--navy);width:max-content}
.legenda .itens{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:8px 0 2px}
.legenda .it{display:flex;align-items:center;gap:6px}
.legenda .sw{display:inline-block;width:22px;height:14px;border-radius:3px;border:1px solid var(--line)}
.legenda .escala{display:inline-block;width:120px;height:14px;border-radius:3px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(29,122,70,.55),#fff 33%,rgba(242,107,46,.55))}
.mute{color:var(--mute)}.small{font-size:.82rem}
.wrap{padding:16px}
/* grade */
.gridbox{overflow:auto;max-height:calc(100vh - 250px);border:1px solid var(--line);border-radius:8px;margin:12px 16px}
table.g{border-collapse:separate;border-spacing:0;font-size:.8rem}
.g th,.g td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
.g thead th{position:sticky;top:0;background:#fff;z-index:3}
.g tr.occ th,.g tr.occ td{position:sticky;top:38px;z-index:3;background:#fff}
.g tr.sug th,.g tr.sug td{position:sticky;top:62px;z-index:3;background:#fff}
.g tr.fixa th,.g tr.fixa td{position:sticky;z-index:3;background:#fff}
.g tr.fixa .nm{z-index:4}
.g tr.rit2 td{border-bottom:2px solid var(--line)}
.g .rit-x{font-size:.66rem;color:var(--mute);font-weight:700;line-height:1}
.prot{font-size:.62rem;margin-left:2px}
.sgx{display:block;font-size:.64rem;font-weight:700;color:#8a5a00;line-height:1.1}
.rea-m{font-size:.6rem;margin-left:2px;color:var(--navy)}
.rea-on{display:flex;gap:8px;align-items:center;font-weight:700;margin:6px 0 10px}
.rea-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.rea-grid h3{font-size:1rem;margin:0 0 4px}
.rea-t{width:auto;margin:6px 0}.rea-t input{width:64px}
.cp-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 14px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.cp-lista label{display:flex;gap:6px;align-items:center;font-size:.85rem}
.au-st{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--panel)}.au-st.on b:first-child{color:var(--ok)}.au-st.off b:first-child{color:var(--bad)}
.au-par{margin:10px 0}.au-par summary{cursor:pointer;font-weight:700;color:var(--navy)}
.au-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px 18px;margin-top:8px}
.au-l{display:grid;gap:2px}.au-l span{font-weight:700;font-size:.85rem}.au-l small{color:var(--mute);font-size:.75rem}
.au-det{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px}
.aj{max-width:1180px}
.aj-s h4{margin:4px 0 6px;font-size:.92rem}
.aj-s{margin:14px 0}
.aj-flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;margin:8px 0 14px}
.aj-box{flex:1;min-width:170px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;gap:2px;background:var(--panel)}
.aj-box small{color:var(--mute);font-weight:700;text-transform:uppercase;font-size:.7rem;letter-spacing:.04em}.aj-box>b{font-size:1.5rem}.aj-box span{font-size:.8rem;color:var(--mute)}
.aj-box.laranja{background:var(--orange-soft);border-color:#f7c3a8}.aj-box.navy{background:var(--navy);color:#fff}.aj-box.navy span,.aj-box.navy small{color:#cfd6e4}
.aj-op{align-self:center;font-size:1.6rem;font-weight:800;color:var(--mute)}
.aj-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.aj-tl{display:grid;gap:6px}.aj-tl div{display:grid;grid-template-columns:110px 110px 1fr;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;background:var(--panel)}
.aj-tl span{color:var(--mute);font-size:.8rem}.aj-tl em{font-style:normal;font-weight:800}.aj-tl .x{background:var(--bad-soft);text-decoration:line-through;color:var(--bad)}
.aj-t,.aj-mini{border-collapse:collapse;font-size:.85rem}.aj-t td,.aj-t th,.aj-mini td,.aj-mini th{border:1px solid var(--line);padding:4px 10px;text-align:center}.aj-t th,.aj-mini th{background:var(--panel)}
.aj-mini .hl{background:var(--orange);color:#fff;font-weight:800}
.aj-onde{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}.aj-tag{font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px}.aj-tag.ver{background:#e7eefb;color:var(--navy)}.aj-tag.conf{background:var(--orange-soft);color:#a3441a}
.aj-ir{margin-top:6px;padding:4px 12px;font-size:.82rem}
.aj-n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--orange);color:#fff;font-size:.72rem;font-weight:800;margin-right:4px;flex:none}
.aj-g{border-collapse:separate;border-spacing:0;font-size:.78rem;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.aj-g th,.aj-g td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
.aj-g th{background:#fff;text-align:left;font-weight:700}.aj-g tr:first-child th{background:var(--panel);text-align:center}
.aj-c{min-width:62px;line-height:1.15}.aj-c small{display:block;color:var(--mute);font-size:.66rem}.aj-c .b{display:inline-block;font-size:.66rem;border-radius:4px;padding:0 3px;margin-left:2px;font-weight:700}
.aj-c.res{background:var(--occ)}.aj-c.blk{background:repeating-linear-gradient(135deg,#eef0f4 0 5px,#d9dde5 5px 7px)}
.aj-leg{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:.88rem}
.aj-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.aj-steps>div{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;align-content:start}.aj-steps p{margin:0;font-size:.84rem;color:var(--mute)}
.aj-chips{display:flex;gap:4px}.aj-chips span{font-size:.75rem;font-weight:700;border:1px dashed #b8bfcc;color:#9aa1ae;border-radius:6px;padding:2px 8px;text-decoration:line-through}.aj-chips .on{background:var(--navy);color:#fff;border:1px solid var(--navy);text-decoration:none}
.aj-selmock{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.aj-selmock i{height:16px;border-radius:3px;background:#f0f2f6;opacity:.7}.aj-selmock i.s{background:var(--orange-soft);box-shadow:inset 0 0 0 1.5px rgba(242,107,46,.75);opacity:1}
.aj-pa{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.82rem}.aj-pa span:first-child{flex:1;font-weight:700}.aj-pa .v{border:1px solid var(--line);border-radius:6px;padding:2px 6px}.aj-pa .go{background:var(--orange);color:#fff;border-radius:6px;padding:1px 9px;font-weight:800}
.aj-kpi{display:flex;gap:6px}.aj-kpi span{flex:1;background:var(--panel);border-radius:6px;padding:4px;display:grid;text-align:center;font-size:.7rem;color:var(--mute)}.aj-kpi b{font-size:.95rem;color:inherit}
.aj-pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.aj-pc{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;align-content:start}
.aj-pc small{color:var(--mute);font-weight:700;text-transform:uppercase;font-size:.7rem}.aj-pc>b{font-size:1.3rem}.aj-pc p{margin:0;font-size:.82rem;color:var(--mute)}
.aj-pc.final{background:var(--navy);color:#fff}.aj-pc.final small,.aj-pc.final p{color:#cfd6e4}
.aj-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:4px}.aj-bar i{background:#e3e6ec;border-right:2px solid #fff}.aj-bar i.hl{background:var(--orange)}
.aj-bar-l{display:flex;font-size:.62rem;color:var(--mute);justify-content:space-between;gap:2px}
.aj-clock{display:flex;gap:10px;margin-bottom:8px}.aj-clock span{background:var(--navy);color:#fff;font-weight:800;border-radius:8px;padding:8px 14px;font-size:1.1rem}
.aj-steps2{display:flex;align-items:flex-end;gap:10px;height:110px;padding:6px 0;border-bottom:2px solid var(--line)}
.aj-steps2 div{flex:1;background:linear-gradient(180deg,rgba(242,107,46,.75),rgba(242,107,46,.35));border-radius:6px 6px 0 0;position:relative}.aj-steps2 span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:.75rem;font-weight:800}
.aj-do{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.aj-do>div{border-radius:10px;padding:10px 14px}.aj-do .ok{background:var(--ok-soft)}.aj-do .no{background:var(--bad-soft)}.aj-do ul{margin:6px 0 0;padding-left:18px}.aj-do li{margin:3px 0}
.aj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:10px}
.aj-s{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:#fff}
.aj-s h3{margin:0 0 6px;font-size:1rem;color:var(--navy)}
.aj-s ul{margin:0;padding-left:18px}.aj-s li{margin:4px 0;line-height:1.45}
.aj-dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0}.aj-dl dt{font-weight:700}.aj-dl dd{margin:0;color:var(--mute)}
.pa-guia{margin:12px 14px 0;padding:10px 12px;background:var(--orange-soft);border-radius:8px;font-size:.82rem;line-height:1.4}
.pa-guia ol{margin:6px 0 0;padding-left:18px}.pa-guia li{margin:3px 0}
.au-grava{color:#b4501f}
.au-grav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;margin:8px 0;border-radius:8px;background:var(--orange-soft)}
.pa-desc{font-size:.8rem;color:var(--mute);margin:-4px 0 6px}.pa-pers{background:var(--orange-soft);color:#a3441a;font-weight:700;border-radius:999px;padding:1px 8px}
.pa-dica{font-size:.74rem;color:var(--mute);margin:8px 0 0;line-height:1.35}
.massa{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 8px}.massa button{padding:3px 10px;font-size:.8rem}.massa .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
tr.rsel td{background:var(--orange-soft)}
.rea-nmin{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.rea-nmin label{font-weight:700}
.esc-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0;padding:10px 12px;background:var(--panel);border-radius:8px}
.esc-bar label{font-weight:800}.esc-bar select{font-weight:700}
.rea-t button.x{border:0;color:var(--mute);background:none;font-size:1rem;padding:0 4px}
.g .nm{position:sticky;left:0;background:#fff;z-index:2;min-width:210px;max-width:210px;text-align:left;padding:4px 8px;overflow:hidden;text-overflow:ellipsis}
.g thead .nm,.g tr.occ .nm,.g tr.sug .nm{z-index:4}
.g .dh{width:100px;min-width:100px;max-width:100px;padding:3px 2px;text-align:center;cursor:pointer;font-weight:600;line-height:1.15}
.g .dh small{display:block;color:var(--mute);font-weight:600;font-size:.7rem}
.g .dh.we{background:#f3f4f8}
.g .dh.sel{background:var(--orange-soft);color:var(--ink);box-shadow:inset 0 -3px 0 var(--orange)}.g .dh.sel small{color:var(--orange)}
.g td.c{text-align:center;padding:3px 2px;height:52px;width:100px;min-width:100px;max-width:100px;overflow:hidden;box-sizing:border-box;position:relative;cursor:pointer;font-variant-numeric:tabular-nums}
/* visão limpa */
.g.limpo td.c .b.up,.g.limpo td.c .b.dn,.g.limpo td.o .b.up,.g.limpo td.o .b.dn{background:none;padding:0 1px}
.g.limpo .b.up{color:#2c6b3a}.g.limpo .b.dn{color:#a23a2e}
.g.limpo td.c.full{background:#f6f7f9!important;color:#a9afbb}.g.limpo td.c.full .p{font-weight:500}
.g.limpo td.c.blk{background:repeating-linear-gradient(135deg,#f6f7f9 0 5px,#eceef2 5px 7px)!important;color:#a9afbb}
.g.limpo td.c.we:not(.full):not(.blk){background:#fafbfc}
.g.limpo td.c .b.av{color:#8a91a0;background:none}
.g.limpo:not(.pers) td.c.sel{box-shadow:none}
.g.limpo:not(.pers) .dh.sel{background:#fff;box-shadow:inset 0 -2px 0 var(--orange)}.g.limpo:not(.pers) .dh.sel small{color:var(--mute)}
.g.limpo td.c .sgx{color:var(--mute)}
.g.limpo tr.occ td.o .mute{color:inherit!important;opacity:.75}
.g.sem-sinais tr.rit2{display:none}
.g.limpo td.sv-alerta{color:#a23a2e;font-weight:700}.g.limpo td.sv-alerta .rit-x{color:#a23a2e}
.g td.c .pt{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%}
.pt{width:7px;height:7px;border-radius:50%}.pt.up{background:var(--orange)}.pt.dn{background:#2c8a4b}
.lk-sinais{font-size:.68rem;border:0;background:none;color:var(--orange);cursor:pointer;padding:0 0 0 4px;font-weight:700}
.vis-alt{margin-left:12px;font-weight:500;font-size:.78rem;color:var(--mute)}.vis-alt button{font-size:.74rem;border:1px solid var(--line);background:#fff;padding:1px 8px;cursor:pointer}
.vis-alt button:first-of-type{border-radius:10px 0 0 10px}.vis-alt button:last-of-type{border-radius:0 10px 10px 0;border-left:0}.vis-alt button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.g td.c{white-space:normal;line-height:1.15}.g td.c .b{white-space:nowrap}.g td.c .b.av{font-size:.62rem;padding:0 2px}
.g td.c.full{background:var(--occ)!important;color:#8a91a0}
.g td.c.blk{background:repeating-linear-gradient(135deg,#eef0f4 0 5px,#d9dde5 5px 7px)!important;color:#8a91a0}
.g td.c .sg{display:block;font-size:.68rem;line-height:1.1;white-space:nowrap}
.g td.c .sg s{color:var(--mute);font-weight:600}.g td.c .sg b{color:var(--navy)}
.g td.c.sel{box-shadow:inset 0 0 0 1.5px rgba(242,107,46,.75)}
.g.temsel td.c:not(.sel){opacity:.72}
.g td.c{user-select:none}
.up-t{color:#b4501f}.dn-t{color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(22,41,79,.35);z-index:30;display:grid;place-items:center;padding:16px}
.modal .caixa{background:#fff;border-radius:12px;max-width:860px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 12px 40px rgba(22,41,79,.25)}
.modal .pe{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:14px;position:sticky;bottom:-20px;background:#fff;padding:10px 0}
.modal .pe span{margin-right:auto}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.kpis>div{background:var(--panel);border-radius:8px;padding:8px 12px;display:grid;min-width:110px}
.kpis b{font-size:1.15rem;font-variant-numeric:tabular-nums}.kpis span{font-size:.78rem;color:var(--mute);font-weight:600}.kpis small{font-size:.74rem;color:var(--mute)}
.rtab{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.ftab{overflow:auto;margin:10px 0}
.ftab table{border-collapse:separate;border-spacing:0;font-size:.85rem}
.ftab th,.ftab td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
.ftab tr:first-child th{border-top:1px solid var(--line);background:var(--panel)}
.ftab th.rh,.ftab th.cant{background:var(--panel);text-align:left;border-left:1px solid var(--line)}
.ftab th.cant{font-size:.75rem;color:var(--mute)}
.ftab th.addc,.ftab tr:last-child th{background:#fff;border:0}
.ftab .faixa-lbl{display:inline-flex;align-items:center;gap:2px;font-weight:700}
.ftab .faixa-lbl input{width:52px;padding:2px 4px}
.ftab td{min-width:84px}
.ftab td input{width:56px;text-align:right;padding:4px 6px;background:rgba(255,255,255,.75);font-weight:700}
.ftab td span{margin-left:2px;color:var(--mute);font-size:.8rem}
.ftab button.x{border:0;color:var(--mute);padding:0 4px;font-size:1rem;background:none;margin-left:4px}
.ftab button.x:hover{color:var(--bad)}
.mapa{overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;margin-top:6px}
.mapa table{border-collapse:collapse;font-size:.66rem}
.mapa td{width:12px;min-width:12px;height:12px;border:1px solid #fff;padding:0}
.mapa th.ax{font-weight:600;color:var(--mute);padding:0 4px;text-align:right;white-space:nowrap}
.mapa tr:first-child th.ax{text-align:left;padding:0}
.vazio{background:repeating-linear-gradient(135deg,#fff 0 3px,#f3b9b3 3px 5px)!important}
.vazio-log{max-width:640px;margin:24px auto;text-align:center;background:var(--panel);border-radius:12px;padding:24px}
.aviso ul{margin:4px 0 0;padding-left:20px}
.aviso{background:var(--warn-soft);color:#6b4b00;border-radius:8px;padding:8px 12px;font-size:.85rem;margin:6px 0}

/* ---------- preço (mesma conta do servidor) ---------- */
function calcular(base, pct, one) {
  const f = 1 + (pct || 0) / 100;
  const tem1 = base.some((t) => t[0] === 1);
  let out = base.filter((t) => t[0] !== 1 || tem1).map((t) => [t[0], Math.round(t[1] * f)]);
  if (one !== null && one !== undefined) {
    const ref = out.filter((t) => t[0] > 1).sort((a, b) => a[0] - b[0])[0] || out[0];
    if (ref) { const v = Math.round(ref[1] * (1 + one / 100)); out = out.filter((t) => t[0] !== 1); out.unshift([1, v]); }
  }
  out.sort((a, b) => a[0] - b[0]);
  for (let i = 1; i < out.length; i++) if (out[i][1] > out[i - 1][1]) out[i][1] = out[i - 1][1];
  return out;
}

  if (!AG?.regioes || !REA?.freio?.length) return "";
  const iv7 = (r) => r.faixas?.find((x) => x.lead_min === 0)?.intervalo ?? r.intervalo;
  const comInt = AG.regioes.filter((r) => iv7(r) != null).map((r) => ({ ...r, intervalo: iv7(r) })).sort((a, b) => a.intervalo - b.intervalo);
  if (!comInt.length) return "";
  const pick = [...new Set([S.region, comInt[0].name, comInt[Math.floor(comInt.length / 2)].name, comInt[comInt.length - 1].name])].map((n) => comInt.find((r) => r.name === n)).filter(Boolean).slice(0, 4);
  const dias = (x, iv) => Math.ceil(x * Math.max(1, iv));
  const fr = REA.freio.filter((f) => Number(f.usar) < 100);
  return `<p class="small mute" style="margin:6px 0 2px">Na prática, para noites a 0–7 dias do check-in:</p><table class="t rea-t"><tr><th>Região</th><th>Normal</th>${fr.map((f) => `<th>usa ${f.usar}% com</th>`).join("")}</tr>

}

  });

async function verRodada(id, region) {
  const run = AUTO_RUNS.find((r) => r.id === id); const det = $("#au-det"); if (!det || !run) return;
  const pr = (run.resumo?.por_regiao || []).slice().sort((a, b) => (b.itens ?? 0) - (a.itens ?? 0));
  const hojeRun = new Date(new Date(run.started_at).getTime() - 3 * 3600e3).toISOString().slice(0, 10) === hoje();
  const gv = run.resumo?.gravacao;
  const podeGravar = run.status === "ok" && hojeRun && !(gv && gv.feitas?.length);
  const regsCom = pr.filter((x) => x.itens);
  det.innerHTML = `<div class="au-det"><h3>Rodada de ${fmtHora(run.started_at)} — por região</h3>
    ${gv?.feitas?.length ? `<div class="aviso" style="background:var(--ok-soft);color:var(--ok)">Gravada na Stays por ${esc(gv.por || "")}: ${gv.ok} diárias${gv.erro ? `, <b class="msg">${gv.erro} com erro</b>` : ""} (${gv.feitas.length} regiões).</div>` : ""}
    ${podeGravar && regsCom.length ? `<div class="au-grav"><b>Aprovou?</b> <span class="small mute">Marque as regiões e grave na Stays exatamente o "iria para" desta rodada.</span>
       <label class="small"><input type="checkbox" id="gr-todas" checked> todas</label>
       <button class="prim" id="gr-btn">Gravar esta rodada na Stays</button><span id="gr-msg" class="small"></span></div>`
      : !hojeRun ? `<p class="small mute">Rodada de outro dia: para gravar, use a rodada mais recente.</p>` : ""}
    <div class="rtab" style="max-height:260px"><table class="t"><tr><th>Região</th><th>Unidades</th><th>Mudariam</th><th>Sobem</th><th>Descem</th><th>Já certas</th><th>Travadas</th><th>Protegidas</th><th></th></tr>
    ${pr.map((x) => x.pulada || x.erro ? `<tr class="mute"><td>${esc(x.region)}</td><td colspan="7">${esc(x.pulada ? "fora: " + x.pulada : "erro: " + x.erro)}</td><td></td></tr>`
      : `<tr><td>${podeGravar && x.itens ? `<input type="checkbox" data-grr="${esc(x.region)}" checked> ` : ""}${esc(x.region)}</td><td>${x.units}</td><td><b>${x.itens}</b></td><td class="up-t">${x.sobem}</td><td class="dn-t">${x.descem}</td><td>${x.ja_certas}</td><td>${x.travadas}</td><td>${x.protegidas ?? 0}</td>
        <td>${x.itens ? `<button data-rg-run="${esc(x.region)}">Ver diárias</button>` : ""}</td></tr>`).join("")}</table></div><div id="au-itens"></div></div>`;
  if ($("#gr-todas")) $("#gr-todas").onchange = (e) => det.querySelectorAll("[data-grr]").forEach((c) => (c.checked = e.target.checked));
  if ($("#gr-btn")) $("#gr-btn").onclick = async () => {
    const regioes = [...det.querySelectorAll("[data-grr]:checked")].map((c) => c.dataset.grr);
    if (!regioes.length) return ($("#gr-msg").innerHTML = `<span class="msg">Marque pelo menos uma região.</span>`);
    const b = $("#gr-btn"); b.disabled = true; $("#gr-msg").innerHTML = `<span class="mute">Calculando o resumo…</span>`;
    try {
      const R = await api("auto_gravar", { run_id: id, regioes, fase: "previa" });
      $("#gr-msg").innerHTML = ""; b.disabled = false;
      const aviso = (R.pulados ? `<div class="aviso">${R.pulados} noite(s) foram ajustadas depois da rodada e serão puladas (o ajuste mais recente vale).</div>` : "")
        + `<p class="small mute">${regioes.length} região(ões). A gravação vai uma região por vez para respeitar o limite da Stays — pode levar alguns minutos.</p>`;
      abrirModal(htmlResumo(R, `Gravar a rodada de ${fmtHora(run.started_at)} na Stays`, aviso), R.n ? `Confirmar e gravar ${R.n} diárias` : null, async () => {
        const ok = $("#m-ok"); ok.disabled = true;
        try { let st;
          do { st = await api("auto_gravar", { run_id: id, regioes, fase: "gravar" }); ok.textContent = `Gravando… ${st.feitas} de ${st.feitas + st.faltam} regiões`; } while (st.faltam > 0);
          fecharModal(); S.grid = null;
          await carregarAuto(st.erro ? `<span class="msg">Gravado com ${st.erro} erro(s) — reprecificar: ${esc((st.erros || []).join(" | "))}</span>` : `<span class="okmsg">Rodada gravada na Stays: ${st.ok} diárias. Está no Histórico, com Desfazer.</span>`);
          verRodada(id);
        } catch (e) { $("#m-msg").innerHTML = `<span class="msg">${esc(e.message)}</span>`; ok.disabled = false; ok.textContent = "Tentar de novo"; }
      });
    } catch (e) { $("#gr-msg").innerHTML = `<span class="msg">${esc(e.message)}</span>`; b.disabled = false; }
  };
  det.querySelectorAll("[data-rg-run]").forEach((b) => (b.onclick = async () => {
    const box = $("#au-itens"); box.innerHTML = "Carregando…";
    try { const { itens } = await api("auto_itens", { run_id: id, region: b.dataset.rgRun, limit: 1500 });
      box.innerHTML = `<h3 style="margin-top:12px">${esc(b.dataset.rgRun)} — ${itens.length} diárias</h3><div class="rtab" style="max-height:360px"><table class="t"><tr><th>Anúncio</th><th>Data</th><th>Ajuste atual</th><th>Sugestão</th><th>Iria para</th><th>Por quê</th></tr>
        ${itens.map((i) => `<tr><td>${esc(nomeCurto(i.sell_nome || ""))}</td><td>${fmtD(i.date)}</td><td>${sinal(Number(i.pct_atual))}%</td><td>${sinal(Number(i.pct_sugerido))}%</td><td class="${Number(i.pct_novo) > Number(i.pct_atual) ? "up-t" : "dn-t"}"><b>${sinal(Number(i.pct_novo))}%</b></td><td class="small mute">${esc(i.motivo || "")}</td></tr>`).join("")}</table></div>`; }
    catch (e) { box.innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
  }));
  det.scrollIntoView({ behavior: "smooth", block: "start" });
}

function mdLite(t) {
  const linhas = esc(t).split("\n"); let h = "", tab = null, lista = false;
  const inl = (x) => x.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const fechaLista = () => { if (lista) { h += "</ul>"; lista = false; } };
  const cel = (c) => { // "80%" vira barra; "+15%" / "−10%" vira selo colorido
    const nu = c.replace(/\*\*/g, "").trim();
    let m = nu.match(/^(\d{1,3}(?:[.,]\d+)?)\s?%(.*)$/);
    if (m) { const v = Math.min(100, parseFloat(m[1].replace(",", "."))); return `<span class="ia-bar" style="--p:${v}%"><b>${esc(m[1])}%</b></span>${inl(m[2] || "")}`; }
    m = nu.match(/^([+−-])\s?(\d{1,3}(?:[.,]\d+)?)\s?%(.*)$/);
    if (m) return `<span class="ia-chip ${m[1] === "+" ? "up" : "dn"}">${m[1] === "-" ? "−" : m[1]}${esc(m[2])}%</span>${inl(m[3] || "")}`;
    return inl(c);
  };
  const fechaTab = () => { if (tab) { h += `<div class="ia-tw"><table class="ia-tab">${tab.map((r, i) => `<tr>${r.map((c) => i ? `<td>${cel(c)}</td>` : `<th>${inl(c)}</th>`).join("")}</tr>`).join("")}</table></div>`; tab = null; } };
  for (const l of linhas) {
    const tl = l.trim();
    if (/^\|.*\|$/.test(tl)) { fechaLista(); if (/^\|[\s:|-]+\|$/.test(tl)) continue; (tab ??= []).push(tl.slice(1, -1).split("|").map((c) => c.trim())); continue; }
    fechaTab();
    if (/^[-•] /.test(tl)) { if (!lista) { h += "<ul>"; lista = true; } h += `<li>${inl(tl.slice(2))}</li>`; continue; }
    fechaLista();
    if (/^#{1,4} /.test(tl)) { h += `<p><b>${inl(tl.replace(/^#+ /, ""))}</b></p>`; continue; }
    if (tl) h += `<p>${inl(tl)}</p>`;
  }
  fechaTab(); fechaLista(); return h;
}

  if (!SB.dados) {
    try { SB.dados = await api("sug_base", { meses: 6 }); for (const u of SB.dados.unidades) SB.pct[u.sell_id] = Object.fromEntries(u.meses.map((m) => [m.mes, m.sug])); }
    catch (e) { $("#sb").innerHTML = `<p class="msg">${esc(e.message)}</p>`; return; }
  }
  desenharBase();
}
function sbVisiveis() {
  const b = SB.busca.trim().toLowerCase();
  return (SB.dados?.unidades || []).filter((u) => SB.prio.has(u.prioridade) && (!SB.reg || u.region_name === SB.reg) && (!b || (u.code || "").toLowerCase().includes(b) || u.nome.toLowerCase().includes(b)));
}
function desenharBase() {
  const el = $("#sb"); if (!el || !SB.dados) return;
  const us = sbVisiveis(); const meses = SB.dados.unidades[0]?.meses.map((m) => m.mes) || [];
  $("#sb-cont").textContent = `${us.length} unidade(s) na lista`;
  if (!us.length) { el.innerHTML = `<p class="mute">Nenhuma unidade com esse filtro.</p>`; barraBase(); return; }
  const pc = (v) => v == null ? "—" : `${Math.round(v)}%`;
  let h = `<div class="sb-box"><table class="t sb-t"><thead><tr><th><input type="checkbox" id="sb-all" title="Marcar todas da lista"></th><th>Unidade</th><th>Prior.</th><th title="Ocupação já vendida nos 6 meses">6 meses</th>${meses.map((m) => `<th>${NOME_MES(m)}</th>`).join("")}</tr></thead><tbody>`;
  for (const u of us) {
    h += `<tr class="${SB.marc.has(u.sell_id) ? "on" : ""}"><td><input type="checkbox" data-sbm="${u.sell_id}" ${SB.marc.has(u.sell_id) ? "checked" : ""}></td>
      <td class="sb-n"><b>${esc(u.code || "")}</b> ${esc(nomeCurto(u.nome))}<div class="small mute">${esc(u.region_name)}</div></td>
      <td><span class="sb-p ${u.prioridade}">${PRIO[u.prioridade]}</span></td><td><b>${pc(u.occ6)}</b></td>`;
    for (const m of u.meses) {
      const v = SB.pct[u.sell_id]?.[m.mes] ?? 0;
      h += `<td class="sb-c ${m.sug ? "s" + m.sug : ""}" title="${esc(`${m.vendidas} de ${m.livres} noites vendidas · região ${pc(m.reg)} · ano passado ${pc(m.ly)} · automação hoje ${m.pct > 0 ? "+" : ""}${Math.round(m.pct)}%${m.base ? ` · base média R$ ${m.base}` : ""}`)}">
        <div class="sb-o"><b>${pc(m.occ)}</b> <span>reg ${pc(m.reg)}</span><span>a.p. ${pc(m.ly)}</span></div>
        <label class="sb-in">base <input type="number" data-sbu="${u.sell_id}" data-sbmes="${m.mes}" value="${v || ""}" placeholder="0" step="5">%</label></td>`;
    }
    h += `</tr>`;
  }
  el.innerHTML = h + `</tbody></table></div>`;
  el.querySelectorAll("[data-sbm]").forEach((c) => c.onchange = () => { c.checked ? SB.marc.add(c.dataset.sbm) : SB.marc.delete(c.dataset.sbm); c.closest("tr").classList.toggle("on", c.checked); barraBase(); });
  $("#sb-all").onchange = (e) => { for (const u of us) e.target.checked ? SB.marc.add(u.sell_id) : SB.marc.delete(u.sell_id); desenharBase(); };
  el.querySelectorAll("[data-sbu]").forEach((i) => i.onchange = () => { (SB.pct[i.dataset.sbu] ??= {})[i.dataset.sbmes] = Number(i.value || 0); barraBase(); });
  barraBase();
}
function sbPlano() { // [{u, meses:[{mes,pct,dates,base}]}]
  const hj = hoje(); const out = [];
  for (const id of SB.marc) {
    const u = SB.dados.unidades.find((x) => x.sell_id === id); if (!u) continue;
    const ms = [];
    for (const m of u.meses) {
      const p = Number(SB.pct[id]?.[m.mes] || 0); if (!p) continue;
      const dates = []; const fim = addD(m.mes.slice(0, 8) + "28", 4).slice(0, 8) + "01";
      for (let d = m.mes < hj ? hj : m.mes; d < fim; d = addD(d, 1)) dates.push(d);
      ms.push({ mes: m.mes, pct: p, dates, base: m.base });
    }
    if (ms.length) out.push({ u, meses: ms });
  }
  return out;
}
function barraBase() {
  const b = $("#sb-barra"); if (!b) return;
  const P = sbPlano(); const n = P.reduce((a, x) => a + x.meses.reduce((c, m) => c + m.dates.length, 0), 0);
  if (!SB.marc.size) { b.innerHTML = ""; return; }
  b.innerHTML = `<div class="in"><b>${SB.marc.size}</b> unidade(s) marcada(s) · ${P.length} com % na base · ${n.toLocaleString("pt-BR")} noites <button id="sb-limpa">Limpar</button><button class="prim" id="sb-prev" ${n ? "" : "disabled"}>Prévia e aplicar</button></div>`;
  $("#sb-limpa").onclick = () => { SB.marc.clear(); desenharBase(); };
  $("#sb-prev").onclick = () => previaBase(P, n);
}
function previaBase(P, n) {
  const linhas = P.map(({ u, meses }) => `<tr><td><b>${esc(u.code || "")}</b> ${esc(nomeCurto(u.nome))}</td><td>${meses.map((m) => `<span class="sb-pm">${NOME_MES(m.mes)} <b>${m.pct > 0 ? "+" : ""}${m.pct}%</b>${m.base ? ` <small>R$ ${m.base} → ${Math.round(m.base * (1 + m.pct / 100))}</small>` : ""}</span>`).join(" ")}</td></tr>`).join("");
  abrirModal(`<h3>Prévia: mudar a base de ${P.length} unidade(s)</h3>
    <p class="small">A <b>diária base</b> das noites abaixo muda o %. O preço na Stays muda na mesma proporção e a automação continua ajustando por cima da nova base. Valores em "R$" são a base média do mês (menor estadia).</p>
    <div style="max-height:50vh;overflow:auto"><table class="t">${linhas}</table></div>
    <p><b>${n.toLocaleString("pt-BR")}</b> noites · fica no Histórico como "sugestão de base", com Desfazer.</p>`, `Confirmar e gravar na Stays`, async () => {
    $("#m-ok").disabled = true; let ok = 0, erro = 0, feito = 0; const erros = [];
    const fila = P.slice();
    const um = async () => { while (fila.length) { const { u, meses } = fila.shift();
      const mapa = {}; for (const m of meses) for (const d of m.dates) mapa[d] = m.pct;
      try { const r = await api("apply", { op: "base_pct", sell_ids: [u.sell_id], dates: Object.keys(mapa), base_pct_por_sell_data: { [u.sell_id]: mapa }, origem: "sugestão de base" }); ok += r.ok; erro += r.erro; erros.push(...(r.erros || [])); }
      catch (e) { erro++; erros.push(`${u.code || u.nome}: ${e.message}`); }
      feito++; $("#m-msg").textContent = `Gravando… ${feito}/${P.length} unidades`; } };
    await Promise.all([um(), um(), um()]);
    fecharModal(); SB.marc.clear(); SB.dados = null; S.grid = null;
    alert(erro ? `Gravado com ${erro} erro(s):\n${erros.slice(0, 8).join("\n")}` : `Base atualizada: ${ok.toLocaleString("pt-BR")} diárias gravadas na Stays. Está no Histórico, com Desfazer.`);
    telaBase();
  });
}

async function telaLog() {
  $("#app").innerHTML = cabecalho() + `<div class="faixa"><label>Região <select id="lg-reg"><option value="">Todas</option>${S.regions.map((r) => `<option>${esc(r.name)}</option>`).join("")}</select></label>
   <label>Usuário <input id="lg-user" placeholder="e-mail"></label><button id="lg-go">Filtrar</button></div><div class="wrap" id="lg">Carregando…</div>`;
  ligarCab();
  $("#lg-go").onclick = carregarLog; carregarLog();
}
let LOG_ROWS = [];
function vazioLog() {
  const filtro = $("#lg-reg")?.value || $("#lg-user")?.value.trim();
  return `<div class="vazio-log"><h2>${filtro ? "Nada encontrado com esse filtro" : "Ainda não há alterações registradas"}</h2>
   <p class="mute">Aqui aparece cada gravação feita pela ferramenta: quem gravou, quando, qual ação (ajuste %, 1 noite, volta à base, sugestão da automação), em quais anúncios e datas, e o preço antes → depois. Mudanças na tabela de automação também ficam registradas, assim como as diárias alteradas direto na Stays (nesse caso o preço novo vira a diária base).</p>
   <p class="mute">Cada lote tem o botão <b>Desfazer</b>, que mostra uma prévia e, depois de confirmar, devolve na Stays os valores de antes.</p></div>`;
}
/* desfazer: prévia (atual → valor anterior) a partir do log e confirmação */
function previaDesfazer(batch) {
  const rs = LOG_ROWS.filter((r) => r.batch_id === batch && r.status === "ok" && r.date && (r.before || []).length);
  if (!rs.length) return alert("Nada para desfazer nesse lote.");
  const ch = rs.map((r) => ({ id: r.sell_nome || "?", d: r.date, antes: r.after || [], depois: r.before || [] }));
  const R = resumir(ch, {});
  const at = rs[0].at, chaves = new Set(rs.map((r) => (r.sell_nome || "") + "|" + r.date));
  const depois = LOG_ROWS.filter((r) => r.batch_id !== batch && r.status === "ok" && r.date && r.at > at && chaves.has((r.sell_nome || "") + "|" + r.date));
  const aviso = depois.length ? `<div class="aviso"><b>Atenção:</b> ${depois.length} dessas diárias foram alteradas de novo depois deste lote. Desfazer volta para o valor de antes deste lote e passa por cima dessas mudanças mais recentes.</div>` : "";
  abrirModal(htmlResumo(R, `Desfazer lote de ${fmtHora(at)} · ${esc(rs[0].user_email || "")}`, `<p class="small mute">Antes = valor gravado por este lote · Depois = valor que volta para a Stays.</p>` + aviso),
    `Confirmar e desfazer ${R.n} diárias`, async () => {
      const ok = $("#m-ok"); ok.disabled = true; ok.textContent = "Desfazendo na Stays…";
      try { const r = await api("revert", { batch_id: batch }); fecharModal(); alert(r.erros.length ? `Desfeito com erros — reprecificar:\n${r.erros.join("\n")}` : `Desfeito: ${r.ok} diárias.`); S.grid = null; carregarLog(); }
      catch (e) { $("#m-msg").innerHTML = `<span class="msg">${esc(e.message)}</span>`; ok.disabled = false; ok.textContent = "Tentar de novo"; }
    });
}
const NOMES_OP = { pct: "Ajuste %", one_night_on: "Liberou 1 noite", one_night_off: "Tirou 1 noite", reset: "Voltou à base", rebase: "Redefiniu base", desfazer: "Desfez", regras: "Alterou regras", base_stays: "Base atualizada (mudança feita direto na Stays)", reacao: "Alterou a reação às vendas", automacao_cfg: "Automação automática", base_oficial: "Base oficial definida", regiao_cfg: "Região: grupo/tabela própria", grupo_cfg: "Grupo de regiões", base_pct: "Mudou a base (%)", base_novo: "Anúncio novo" };
async function carregarLog() {
  try {
    const { rows } = await api("log", { region: $("#lg-reg").value || undefined, user: $("#lg-user").value.trim() || undefined, limit: 1000 });
    const lotes = {};
    LOG_ROWS = rows;
    if (!rows.length) { $("#lg").innerHTML = vazioLog(); return; }
    for (const r of rows) { const k = r.batch_id || "r" + r.id; (lotes[k] ??= { ...r, n: 0, erros: 0, imoveis: new Set(), datas: [] }); lotes[k].n++; if (r.status !== "ok") lotes[k].erros++; if (r.sell_nome) lotes[k].imoveis.add(r.sell_nome); if (r.date) lotes[k].datas.push(r.date); }
    const fmt = (p) => (p || []).map((t) => `${t[0]}n ${brl(t[1])}`).join(" · ");
    $("#lg").innerHTML = `<table class="t"><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Região</th><th>Imóveis</th><th>Datas</th><th>Diárias</th><th></th></tr>
     ${Object.values(lotes).map((b) => { const ds = b.datas.sort(); return `<tr><td>${fmtHora(b.at)}</td><td>${esc(b.user_email)}</td><td>${NOMES_OP[b.action] || esc(b.action)}${b.pct != null && b.action === "pct" ? ` ${b.pct > 0 ? "+" : ""}${b.pct}%` : ""}${b.action === "one_night_on" ? ` +${b.one_night_pct}%` : ""}<div class="small mute">${esc(b.origem || "")}</div></td>
       <td>${esc(b.region_name || "")}</td><td>${b.imoveis.size}<div class="small mute">${esc([...b.imoveis].slice(0, 2).join(", "))}${b.imoveis.size > 2 ? "…" : ""}</div></td>
       <td>${ds.length ? fmtD(ds[0]) + (ds.length > 1 ? " a " + fmtD(ds[ds.length - 1]) : "") : ""}</td>
       <td>${b.n}${b.erros ? ` <span class="msg">(${b.erros} com erro)</span>` : ""}<div class="small mute">${b.date ? "ex.: " + fmt(b.before) + " → " + fmt(b.after) : ""}</div></td>
       <td>${b.batch_id && b.action !== "regras" && b.action !== "desfazer" && b.action !== "base_stays" && b.action !== "reacao" && b.n - b.erros > 0 ? `<button data-rev="${b.batch_id}">Desfazer</button>` : ""}</td></tr>`; }).join("") || ""}</table>`;
    document.querySelectorAll("[data-rev]").forEach((b) => (b.onclick = () => previaDesfazer(b.dataset.rev)));
  } catch (e) { $("#lg").innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
}

/* ---------- início ---------- */
async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return telaLogin();
  if (!DOMINIO.test(session.user.email || "")) { await sb.auth.signOut(); return telaLogin("Só contas @carpediemhomes.com.br."); }
  S.user = session.user.email;
  try { const r = await api("regions"); S.regions = r.regions; S.limites = r.limites || S.limites; }
  catch (e) { $("#app").innerHTML = `<p class="wrap msg">${esc(e.message)}</p>`; return; }
  if (S.region && !S.regions.some((r) => r.name === S.region)) S.region = "";
  render();
}
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "PASSWORD_RECOVERY") { criandoSenha = true; telaSenha(session?.user?.email); }
  else if (ev === "SIGNED_IN" && !criandoSenha && !S.user) iniciar();
});
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (criandoSenha && session) return telaSenha(session.user.email);
  if (!criandoSenha) iniciar();
})();
</script>
